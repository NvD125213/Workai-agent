# Hot-reload cho cmd/worker bằng air (https://github.com/air-verse/air).
# Chạy: air -c .air.worker.toml   (DB bật riêng bằng: docker compose up -d db)
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/worker ./cmd/worker"
  entrypoint = ["./tmp/worker"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "bin", "tests", "migrations", ".agents"]
  exclude_regex = ['_test\.go$']
  delay = 500
  stop_on_error = true
  # Gửi SIGINT để process graceful shutdown (air tự bỏ qua trên Windows)
  send_interrupt = true
  kill_delay = "2s"
  log = "build-errors-worker.log"

  [build.windows]
    cmd = "go build -o ./tmp/worker.exe ./cmd/worker"
    entrypoint = ['tmp\worker.exe']

[log]
  time = false
  main_only = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
