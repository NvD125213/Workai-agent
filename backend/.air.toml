# Hot-reload cho cmd/api bằng air (https://github.com/air-verse/air).
# Chạy: air -c .air.toml   (DB bật riêng bằng: docker compose up -d db)
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  entrypoint = ["./tmp/api"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["tmp", "bin", "tests", "migrations", ".agents"]
  exclude_regex = ['_test\.go$']
  delay = 500
  stop_on_error = true
  # Gửi SIGINT để process graceful shutdown (air tự bỏ qua trên Windows)
  send_interrupt = true
  kill_delay = "2s"
  log = "build-errors-api.log"

  [build.windows]
    cmd = "go build -o ./tmp/api.exe ./cmd/api"
    entrypoint = ['tmp\api.exe']

[log]
  time = false
  main_only = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
